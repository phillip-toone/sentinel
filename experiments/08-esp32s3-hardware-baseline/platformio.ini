; Sentinel Experiment 08
; LILYGO T-Display S3 hardware baseline
;
; This experiment intentionally uses a minimal PlatformIO
; configuration. The LCD, touch interface, PSRAM, and other
; board peripherals are not exercised.

[env:t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino

monitor_speed = 115200

upload_protocol = esptool

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1